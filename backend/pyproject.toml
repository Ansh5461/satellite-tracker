[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gp-visualiser-backend"
version = "2.0.0"
description = "Real-Time LEO Orbital Telemetry & RF Pass Predictor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sgp4>=2.27",
  "numpy>=1.26.0",
  "scipy>=1.11.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dateutil>=2.9.0",
  "redis[hiredis]>=5.2.0",
  "orjson>=3.10.0",
  "astropy>=6.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-benchmark>=4.0.0",
  "fakeredis[lua]>=2.26.0",
  "locust>=2.32.0",
  "websockets>=13.0",
  "jupyter>=1.1.0",
  "matplotlib>=3.9.0",
  "nbconvert>=7.16.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "validation: Vallado/astropy numerical fidelity checks",
  "benchmark: latency and throughput benchmarks",
]

[tool.pytest-benchmark]
disable_gc = true
min_rounds = 5
